# ============================================================
# Deploy to Cloudflare Pages
# 触发器：push 到 main / 手动 workflow_dispatch
# 说明：
#   - 用 Hugo (extended) 构建静态站到 public/
#   - 用 cloudflare/pages-action 把 public/ + 根目录 functions/ 一起部署
#     （Pages Functions 会在 Cloudflare 侧自动启用，投稿/联系/DMCA 表单可用）
# 必填 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  具有 Pages:Edit 权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
# 可选 Secrets：
#   GH_TOKEN / GH_REPO / GH_BRANCH  仅当投稿后端回写 GitHub 时需要（建议放在
#                                     Cloudflare Pages 环境变量里，而非这里）
# ============================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify --gc

      # 关键：从仓库根目录执行部署，cloudflare/pages-action 会一并打包根目录的
      # functions/ 目录（Pages Functions）。若只想部署纯静态站、不用无服务器投稿
      # 后端，可删除仓库根的 functions/ 目录，网站其余功能不受影响。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: diy365
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
