# ============================================================
# Deploy to Cloudflare Pages (可选 · 手动触发)
# 说明：
#   - 本工作流是「直连 Git 部署（A-1）」之外的可选方案：当你不想用
#     Cloudflare 的 Git 集成、而想用 GitHub Actions 直接调 Cloudflare API 部署时，
#     在 Actions 页面手动点 Run workflow 即可。
#   - 默认【不】监听 push，避免与 A-1 的 Git 集成重复部署 / 出现失败运行记录。
#   - 用 Hugo (extended) 构建静态站到 public/，再用 cloudflare/pages-action
#     把 public/ + 根目录 functions/ 一起部署（Pages Functions 自动启用）。
# 必填 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  具有 Pages:Edit 权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
# ============================================================
name: Deploy to Cloudflare Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify --gc

      # 关键：从仓库根目录执行部署，cloudflare/pages-action 会一并打包根目录的
      # functions/ 目录（Pages Functions）。若只想部署纯静态站、不用无服务器投稿
      # 后端，可删除仓库根的 functions/ 目录，网站其余功能不受影响。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: diy365
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
