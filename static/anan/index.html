<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>DIY365 后台 — Decap CMS</title>
</head>
<body>
  <!-- Decap CMS auto-loads ./config.yml from this same /anan/ folder -->
  <!-- CMS_MANUAL_INIT lets us register the Superbed media library before CMS.init() -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>

  <!-- 简体中文界面：config.yml 的 locale: zh_Hans 会读取这里注册的翻译 -->
  <script src="./locale-zh.js"></script>
  <script>
    (function () {
      var zh = window.DIY365_ZH_HANS;
      if (!window.CMS || !zh) return;
      // 以内置英文为底，中文覆盖：避免语言包缺 key 时界面出现空白。
      var en = (typeof CMS.getLocale === 'function' && CMS.getLocale('en')) || {};
      var phrases = Object.assign({}, en, zh);
      // 多注册几个别名 + 兜底覆盖 'en'：无论 Decap 最终选哪个 locale，界面都是中文。
      ['zh_Hans', 'zh', 'zh-CN', 'zh_CN', 'en'].forEach(function (key) {
        CMS.registerLocale(key, phrases);
      });
    })();
  </script>

  <!-- 发布完成后提醒「请用WorkBuddy推送上线」 -->
  <script src="./deploy-notice.js"></script>

  <script src="./superbed-uploader.js"></script>

  <!-- Shortcut to the submission review page. Submissions live in the KV-backed
       Worker, NOT in this CMS's GitHub repo, so there is no collection for them.
       The admin key is never stored in source: the editor is prompted for it. -->
  <script>
    (function () {
      var API = 'https://diy365-submit.binean2046.workers.dev';
      var KEY_STORE = 'diy365_admin_key';
      function add() {
        if (document.getElementById('wbReviewBtn')) return;
        var btn = document.createElement('button');
        btn.id = 'wbReviewBtn';
        btn.type = 'button';
        btn.textContent = '投稿审核';
        btn.title = '打开投稿审核/管理页面（需管理员密钥）';
        btn.style.cssText = 'position:fixed;right:20px;bottom:20px;z-index:2147483000;' +
          'padding:10px 16px;border:none;border-radius:999px;background:#d96b86;color:#fff;' +
          'font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(45,42,46,.25);';
        btn.addEventListener('click', function () {
          var saved = '';
          try { saved = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
          var key = window.prompt('请输入投稿管理密钥（ADMIN_KEY）：', saved);
          if (!key) return;
          key = key.trim();
          try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
          var a = document.createElement('a');
          a.href = API + '/list?key=' + encodeURIComponent(key);
          a.target = '_blank';
          a.rel = 'noopener';
          a.click();
        });
        document.body.appendChild(btn);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add);
      else add();
      if (window.MutationObserver) {
        new MutationObserver(function () {
          if (!document.getElementById('wbReviewBtn')) add();
        }).observe(document.body, { childList: true });
      }
    })();
  </script>
</body>
</html>
