<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>DIY365 后台 — Decap CMS</title>
</head>
<body>
  <!-- Decap CMS auto-loads ./config.yml from this same /anan/ folder -->
  <!-- CMS_MANUAL_INIT lets us register the Superbed media library before CMS.init() -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>

  <!-- 简体中文界面：config.yml 的 locale: zh_Hans 会读取这里注册的翻译 -->
  <script src="./locale-zh.js"></script>
  <script>
    (function () {
      var zh = window.DIY365_ZH_HANS;
      if (!window.CMS || !zh) return;
      // 以内置英文为底，中文覆盖：避免语言包缺 key 时界面出现空白。
      var en = (typeof CMS.getLocale === 'function' && CMS.getLocale('en')) || {};
      var phrases = Object.assign({}, en, zh);
      // 多注册几个别名 + 兜底覆盖 'en'：无论 Decap 最终选哪个 locale，界面都是中文。
      ['zh_Hans', 'zh', 'zh-CN', 'zh_CN', 'en'].forEach(function (key) {
        CMS.registerLocale(key, phrases);
      });
    })();
  </script>

  <!-- 草稿字段安全读写助手（自动标题 / 标签预设共用，须先于 superbed-uploader / tag-presets 加载） -->
  <script src="./field-helper.js?v=20261113"></script>

  <!-- 发布完成后提醒「已经发布成功，看一看前端有没有上线」 -->
  <script src="./deploy-notice.js?v=20261113"></script>

  <!-- 常驻提示：同步机制说明（线上/远程自动更新，本地需 git pull） -->
  <script src="./sync-notice.js?v=20261113"></script>

  <!-- 常驻提示：登录白名单 fail-closed 故障排查说明 -->
  <script src="./whitelist-notice.js?v=20261113"></script>

  <!-- 闲置超时自动退出：超过 1 小时无操作清除登录态并强制重新登录 -->
  <script src="./idle-timeout.js?v=20261113"></script>

  <!-- 后台「标签预设」：保存当前标签组合、下次一键套用 -->
  <script src="./tag-presets.js?v=20261113"></script>

  <script src="./superbed-uploader.js"></script>

  <!-- Submission review is an embedded panel inside the CMS, not an external tab.
       The admin key is entered once per browser and never stored in source. -->
  <script src="./review-panel.js?v=20261112c"></script>
</body>
</html>
