# Decap CMS configuration
# Docs: https://decapcms.org/docs/
# IMPORTANT: change `repo` below and create a GitHub OAuth App (see README).

# 后台界面语言：zh_Hans（简体中文）。语言包见 ./locale-zh.js，注册在 index.html。
locale: zh_Hans

# Custom media library: upload images DIRECTLY to Superbed from the browser.
# Superbed blocks datacenter IPs / non-browser requests, so a server proxy won't work;
# the editor's own browser uploads instead. The token (apiKey) is necessarily public here
# (Decap runs in the browser) — same key PicGo/ShareX use. It is sent as a multipart
# FORM FIELD `token` (NOT an X-API-Key header — that returns "Missing API key"). Keep
# quota low / rotate if abused.
media_library:
  name: superbed
  config:
    endpoint: https://api.superbed.cn/upload
    apiKey: 41871f8e5d6823960d3128b1ffb518a7

backend:
  name: github
  repo: xuanqianye/diy365      # TODO: replace with your GitHub repo (owner/name)
  branch: main
  client_id: Ov23liLP7IRGMwtDriB4
  # Self-hosted (Cloudflify) GitHub login proxy: replaces Netlify's dead api.netlify.com/auth.
  base_url: https://diy365-auth.binean2046.workers.dev

# Images are hosted on superbed (external), so we do not store media in the repo.
media_folder: "static/uploads"     # unused but kept to satisfy Decap
public_folder: "/uploads"

collections:
  - name: "patterns"
    label: "钩针图解"
    label_singular: "篇图解"
    folder: "content/patterns"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string, required: false }
      - { name: description, label: 描述, widget: string, required: false }
      # 发布时间：新建文章自动填当天日期（浏览器本地时间 / 北京时间），可手动改成实际发布日期。
      - { name: date, label: "发布时间", widget: datetime, default: "{{now}}",
          date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, required: false,
          hint: "前台文章页、feed 列表和结构化数据都用这个日期；留空则前台不显示日期。新建时自动填入当天。" }
      # 单篇 SEO：留空则回退到标题 / 描述 / 站点默认设置。
      - { name: seoTitle, label: "SEO 标题（留空用文章标题）", widget: string, required: false }
      - { name: seoDescription, label: "SEO 描述（留空用上面的「描述」）", widget: string, required: false }
      # 自定义短链接：Hugo 会用 front matter 的 slug 覆盖「文件名」那段 URL。
      # 留空则退回标题自动生成的长链接。填 2~4 个英文词即可，例如 mavi-crochet-doll。
      - { name: slug, label: "自定义短链接（留空则用标题）", widget: string, required: false,
          hint: "只填小写英文字母、数字和连字符，例如 mavi-crochet-doll。改短后旧链接会自动跳转，已分享出去的链接建议不要再改。",
          pattern: ['^$|^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小写字母、数字和连字符，例如 mavi-crochet-doll'] }
      - { name: draft, label: "草稿（不发布）", widget: boolean, default: false, required: false }
      # 从「分类管理 / 标签管理」集合里选已有项。保存的是名称字符串数组，
      # 与 Hugo 的 categories/tags taxonomy 完全兼容。
      - name: categories
        label: 分类（从已有分类中选择）
        widget: relation
        collection: categories
        search_fields: [title]
        display_fields: [title]
        value_field: title
        multiple: true
        required: false
        hint: "输入关键字即可搜索已有分类；要新增分类请到左侧「分类管理」。"
      - name: tags
        label: 标签（从已有标签中选择）
        widget: relation
        collection: tags
        search_fields: [title]
        display_fields: [title]
        value_field: title
        multiple: true
        required: false
        hint: "输入关键字即可搜索已有标签；要新增标签请到左侧「标签管理」。"
      # 图床只收 jpg/png/webp。上传器已内置 PDF 自动分段转图：选 PDF 时逐页渲染、
      # 长页切成多段、转成图片后逐张上传。独立的 PDF 字段已移除，PDF 请传到下面的
      # 「图解步骤图」字段，这样每一页都会保留并渲染成组图。
      # 封面图：留空则自动用「图解步骤图」第一张作为封面；可手动上传图片或贴 URL 覆盖。
      - name: cover
        label: "封面图（留空=用步骤图第一张；可手动上传或贴 URL）"
        widget: image
        required: false
      # 图解步骤图：支持多张，可拖动排序；第一张默认作为封面图。
      - name: pinImage
        label: "图解步骤图（可多张；选 PDF 自动裁剪成图片；拖动可排序）"
        widget: list
        required: false
        field:
          name: url
          label: 图片
          widget: image
          required: false
        hint: "第一张默认作为封面图（除非上面单独设了封面图）。拖动每张图片左侧手柄可调整顺序。"
      # 作者：留空则不显示
      - { name: author, label: 作者（留空则不显示）, widget: string, default: "", required: false }
      - { name: submittedBy, label: 投稿人, widget: string, required: false }
      - { name: body, label: "图解步骤（Markdown）", widget: markdown, required: false }

  # 分类 / 标签集中管理：每个条目一个 md 文件，文章里用 relation 多选引用。
  # 这些文件放在仓库根的 taxonomies/ 下，Hugo 不会把它们当内容页渲染；
  # 前台的分类页/标签页仍由文章实际选用的分类自动生成。
  - name: "categories"
    label: "分类管理"
    label_singular: "个分类"
    folder: "taxonomies/categories"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { name: title, label: 分类名称, widget: string,
          hint: "建议用英文，例如 Amigurumi。新增后需在文章里选用，前台才会出现该分类页；改名不会自动更新已发布文章。" }
  - name: "tags"
    label: "标签管理"
    label_singular: "个标签"
    folder: "taxonomies/tags"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { name: title, label: 标签名称, widget: string,
          hint: "建议用英文。新增后需在文章里选用，前台才会出现该标签页；改名不会自动更新已发布文章。" }

  # 全站 SEO / 站点信息：编辑 data/seo.json，重新构建部署后生效。
  # 模板用 merge(site.Params, site.Data.seo) 读取，这里没填的键自动回退到 hugo.toml。
  - name: "seo"
    label: "SEO 设置"
    files:
      - name: "site"
        label: "全站 SEO（标题 / 描述 / 验证码 / 广告 ID）"
        file: "data/seo.json"
        editor:
          preview: false
        fields:
          - { name: brand, label: 品牌名（标题后缀 / 页眉 / 页脚）, widget: string }
          - { name: siteTitle, label: 首页 title（浏览器标签标题）, widget: string }
          - { name: description, label: 默认 meta description, widget: string, required: false }
          - { name: tagline, label: 首页标语, widget: string, required: false }
          - { name: ogImage, label: 默认分享图（留空则用文章封面 / 步骤图）, widget: image, required: false }
          - { name: googleVerification, label: Google Search Console 验证码, widget: string, required: false }
          - { name: pinterestVerification, label: Pinterest 域名验证码, widget: string, required: false }
          - { name: adsensePublisher, label: "AdSense 发布商 ID（占位值不会加载脚本）", widget: string, required: false }
          - { name: adsenseSlotList, label: AdSense 列表页广告位, widget: string, required: false }
          - { name: adsenseSlotPost, label: AdSense 文章页广告位, widget: string, required: false }

  - name: "pages"
    label: "法律与信息页"
    files:
      - { name: about, label: "关于我们", file: "content/pages/about.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: legal}, {name: body, label: 正文, widget: markdown} ] }
      - { name: privacy, label: "隐私政策", file: "content/pages/privacy.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: legal}, {name: body, label: 正文, widget: markdown} ] }
      - { name: terms, label: "服务条款", file: "content/pages/terms.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: legal}, {name: body, label: 正文, widget: markdown} ] }
      - { name: copyright-policy, label: "版权政策", file: "content/pages/copyright-policy.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: legal}, {name: body, label: 正文, widget: markdown} ] }
      - { name: disclaimer, label: "免责声明", file: "content/pages/disclaimer.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: legal}, {name: body, label: 正文, widget: markdown} ] }
      - { name: user-agreement, label: "用户协议", file: "content/pages/user-agreement.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: legal}, {name: body, label: 正文, widget: markdown} ] }
      - { name: contact, label: "联系我们（表单页）", file: "content/pages/contact.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: form}, {name: body, label: 正文, widget: markdown} ] }
      - { name: copyright-removal, label: "版权删除申请（表单页）", file: "content/pages/copyright-removal.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: form}, {name: body, label: 正文, widget: markdown} ] }
      - { name: submit, label: "投稿（表单页）", file: "content/pages/submit.md",
          fields: [ {name: title, label: 标题, widget: string}, {name: description, label: 描述, widget: string},
                    {name: pagetype, widget: hidden, default: form}, {name: body, label: 正文, widget: markdown} ] }
