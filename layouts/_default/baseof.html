<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "share.html" . }}
  {{ if .IsHome }}{{ partial "feed-data.html" . }}{{ end }}
  <script defer src="{{ "js/share.js" | relURL }}"></script>
  <script defer src="{{ "js/feed.js" | relURL }}"></script>
  <script defer src="{{ "js/submit-uploader.js" | relURL }}"></script>
</body>
</html>
