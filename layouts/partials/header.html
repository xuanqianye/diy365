{{- $seo := merge site.Params (hugo.Data.seo | default dict) -}}
<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ "/" | relURL }}">{{ $seo.brand }}</a>
    <form class="site-search" role="search" onsubmit="return false">
      <svg class="site-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" class="site-search-input" id="siteSearch" placeholder="Search patterns…" autocomplete="off" aria-label="Search patterns" aria-expanded="false" aria-controls="siteSearchResults">
      <div class="site-search-results" id="siteSearchResults" role="listbox" hidden></div>
    </form>
    <button class="nav-toggle" aria-label="menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
    <nav class="main-nav" id="nav">
      <a href="{{ "/" | relURL }}">Home</a>
      <a href="{{ "/patterns/" | relURL }}">Patterns</a>
      <a href="{{ "/categories/" | relURL }}">Categories</a>
      <a href="{{ "/tags/" | relURL }}">Tags</a>
    </nav>
  </div>
</header>
