{{- $tax := .tax | default "" -}}
{{- $term := .term | default "" -}}
<div class="feed-controls" id="feedControls" data-taxonomy="{{ $tax }}" data-term="{{ $term }}">
  <span class="feed-label">View</span>
  <select id="feedMode" aria-label="Loading mode">
    <option value="infinite">Infinite scroll</option>
    <option value="paged">Pagination</option>
  </select>
  <select id="feedSize" aria-label="Patterns per page">
    <option value="20">20 per page</option>
    <option value="30">30 per page</option>
    <option value="50">50 per page</option>
  </select>
  <span class="feed-info" id="feedInfo"></span>
</div>
