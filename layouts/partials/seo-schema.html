{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
  "image": "{{ partial "first-url.html" (or .Params.pinImage .Params.cover) }}",
  "datePublished": "{{ .Date }}",
  "author": { "@type": "Organization", "name": "{{ .Site.Params.brand }}" }
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Params.brand }}",
  "url": "{{ .Site.BaseURL }}"
}
</script>
{{ end }}
