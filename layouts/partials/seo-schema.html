{{- $seo := merge site.Params (hugo.Data.seo | default dict) -}}
{{- $pageTitle := .Params.seoTitle | default .Title -}}
{{- $pageDesc := .Params.seoDescription | default .Description | default $seo.description -}}
{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ $pageTitle }}",
  "description": "{{ $pageDesc }}",
  "image": "{{ partial "first-url.html" (or .Params.pinImage .Params.cover $seo.ogImage) }}",
  "datePublished": "{{ .Date }}",
  "author": { "@type": "Organization", "name": "{{ $seo.brand }}" }
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ $seo.brand }}",
  "url": "{{ .Site.BaseURL }}"
}
</script>
{{ end }}
