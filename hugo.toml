baseURL = "https://www.diy365.cc/"
locale = "en"
title = "Handmade - Free Crochet Patterns"
defaultContentLanguage = "en"
enableEmoji = true
paginate = 24
summaryLength = 28

# 安全：不渲染 markdown 内的原始 HTML（用户投稿经审核，但默认收紧 XSS 面）
[markup.goldmark.renderer]
  unsafe = false

[params]
  title = "Handmade"
  description = "Free crochet patterns shared by the community."
  brand = "Handmade"
  tagline = "Free crochet patterns shared by the community."
  # TODO: 替换为你的真实 ID（部署前必改）
  adsensePublisher = "ca-pub-0000000000000000"
  adsenseSlotList = "0000000000"   # 列表页 / 首页信息流广告位
  adsenseSlotPost = "0000000001"    # 帖子内广告位
  pinterestVerification = ""        # TODO: Pinterest HTML 标签内容
  googleVerification = ""           # TODO: Google Search Console 验证
  contactEmail = "copyright@diy365.cc"
  githubRepo = "xuanqianye/diy365"   # TODO: Decap CMS + 投稿后端用，改成你的仓库
  # 投稿后端函数地址
  #   主部署 Cloudflare Pages → "/submit"（functions/submit.js 自动路由）
  #   切换到 Netlify        → "/.netlify/functions/submit"
  submitApi = "https://diy365-submit.binean2046.workers.dev"
  submitEndpoint = "https://diy365-submit.binean2046.workers.dev/submit"

[params.social]
  pinterest = "https://pinterest.com/yourname"   # TODO
  email = "hello@diy365.cc"

# SEO / sitemap / robots 由 Hugo 原生输出
[outputs]
  home = ["HTML", "RSS", "sitemap"]  # sitemap 由 hugo 内置
