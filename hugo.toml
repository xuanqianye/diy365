baseURL = "https://diy365.cc/"
locale = "en"
title = "Handmade - Free Crochet Patterns"
defaultContentLanguage = "en"
# Treat dates in the author's local timezone so posts dated "today" (GMT+8) are not
# mistaken for future-dated content by the UTC build server and silently dropped from
# the build and sitemap.
timeZone = "Asia/Shanghai"
enableEmoji = true
paginate = 24
summaryLength = 28

# Publish content immediately even if its date is in the "future" relative to the
# CI server's UTC clock (Decap-authored posts use the author's local date, which can
# read as tomorrow in UTC). Without this, future-dated posts are silently excluded
# from the build and sitemap.
[build]
  buildFuture = true

# Security: do not render raw HTML inside markdown (reduces the XSS surface)
[markup.goldmark.renderer]
  unsafe = false

[params]
  title = "Handmade"
  description = "Free crochet patterns shared by the community."
  brand = "Handmade"
  tagline = "Color Life with Love and Art"
  # TODO: replace with your real IDs before deploying
  adsensePublisher = "ca-pub-0000000000000000"
  adsenseSlotList = "0000000000"   # list / home feed ad slot
  adsenseSlotPost = "0000000001"    # in-post ad slot
  pinterestVerification = ""        # TODO: Pinterest meta tag content
  googleVerification = ""           # TODO: Google Search Console verification
  googleAnalytics = "G-K9VCKX9RVS"  # GA4 Measurement ID (injected site-wide via head.html gtag)
  bingVerification = ""            # TODO: Bing Webmaster Tools meta content (msvalidate.01); leave empty if verifying via GSC import
  contactEmail = "copyright@diy365.cc"
  githubRepo = "xuanqianye/diy365"   # TODO: repo used by Decap CMS + submit worker
  # Submit backend endpoint
  #   Cloudflare Pages -> "/submit" (functions/submit.js auto route)
  #   Netlify               -> "/.netlify/functions/submit"
  submitApi = "https://diy365-submit.binean2046.workers.dev"
  submitEndpoint = "https://diy365-submit.binean2046.workers.dev/submit"

[params.social]
  pinterest = "https://pinterest.com/yourname"   # TODO
  email = "hello@diy365.cc"

# SEO / sitemap / robots are generated by Hugo.
# Do NOT list "sitemap" under home outputs: that makes the built-in sitemap
# template render against the home page's own .Pages (sections only), producing
# a sitemap with a single URL. Hugo generates sitemap.xml automatically.
[outputs]
  home = ["HTML", "RSS"]
